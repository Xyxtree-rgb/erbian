<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body{margin:0;width:1024px;height:1024px;overflow:hidden;
    background:radial-gradient(circle at 50% 38%,#ffffff 0%,#eef0f3 70%,#e3e6ea 100%);}
  .petal-logo{width:760px;margin:110px auto 0;}
  .petal-logo svg{width:100%;height:auto;display:block;overflow:visible;}
</style></head>
<body>
<div class="petal-logo">
<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="tealG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22c3d6"/><stop offset="1" stop-color="#3aa655"/>
  </linearGradient></defs>
  <g style="mix-blend-mode:multiply">
    <ellipse cx="160" cy="245" rx="72" ry="155" fill="#f3b7c8" opacity=".6" transform="rotate(-16 160 245)"/>
    <ellipse cx="205" cy="228" rx="52" ry="145" fill="url(#tealG)" opacity=".68"/>
    <ellipse cx="250" cy="248" rx="78" ry="145" fill="#fbae17" opacity=".62" transform="rotate(15 250 248)"/>
  </g>
  <rect x="188" y="58" width="32" height="32" rx="3" fill="#bcd9f7" stroke="#1e46c8" stroke-width="6"/>
  <rect x="244" y="88" width="36" height="36" rx="3" fill="#f6c6ea" stroke="#f08c1e" stroke-width="6"/>
</svg>
</div>
</body></html>
