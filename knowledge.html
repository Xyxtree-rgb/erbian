<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>耳辩 · 知识库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Noto+Sans+SC:wght@200;300;400;500;700&display=swap');
:root{
  --ink:#2d2d2d;
  --ink-60:rgba(45,45,45,.6);
  --ink-35:rgba(45,45,45,.35);
  --ink-12:rgba(45,45,45,.12);
  --iri:linear-gradient(100deg,#7ac8ff,#c9a7ff,#ff9ed2,#ffd9a0,#8ef0d2);
  --ease:cubic-bezier(.65,0,.35,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Space Grotesk','Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#dfe2e6 0%,#c9ccd0 60%,#d3d6da 100%);
  color:var(--ink);line-height:1.7;padding:20px;min-height:100vh;
}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;}
.b1{width:44vmax;height:44vmax;right:-14vmax;top:-12vmax;background:radial-gradient(circle at 45% 45%,#9fd0ff,transparent 65%);}
.b2{width:38vmax;height:38vmax;left:-12vmax;bottom:-14vmax;background:radial-gradient(circle at 55% 55%,#ffc4e6,transparent 65%);}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:1;}

h1{font-size:24px;font-weight:200;letter-spacing:.3em;margin-bottom:4px;}
.meta{font-size:12px;color:var(--ink-60);letter-spacing:.08em;margin-bottom:20px;}
.meta b{color:var(--ink);font-weight:700;}

.search-bar{display:flex;gap:8px;margin-bottom:14px;}
#searchInput{
  flex:1;font-size:13.5px;padding:12px 18px;font-family:inherit;
  border:1px solid rgba(255,255,255,.85);border-radius:999px;outline:none;
  background:rgba(255,255,255,.55);color:var(--ink);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .2s,box-shadow .2s;
}
#searchInput::placeholder{color:var(--ink-35);}
#searchInput:focus{border-color:rgba(91,141,239,.6);box-shadow:0 0 0 3px rgba(91,141,239,.15);}

.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.cat-btn{
  font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.08em;
  padding:7px 16px;border:1px solid rgba(255,255,255,.75);border-radius:999px;
  background:rgba(255,255,255,.4);color:var(--ink-60);cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .18s var(--ease);
}
.cat-btn:hover{background:rgba(255,255,255,.75);color:var(--ink);}
.cat-btn.active{background:#2d2d2d;color:#f2f3f5;border-color:#2d2d2d;}

.case-list{display:flex;flex-direction:column;gap:14px;}
.case-card{
  background:rgba(250,251,253,.6);
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid rgba(255,255,255,.85);border-radius:20px;
  padding:20px;box-shadow:0 14px 36px rgba(60,70,95,.12);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.case-card:hover{transform:translateY(-2px);box-shadow:0 20px 46px rgba(60,70,95,.16);}
.case-cat{
  display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.2em;
  padding:3px 12px;border-radius:999px;margin-bottom:10px;
  color:#6a4fc9;border:1px solid rgba(150,120,230,.45);background:rgba(201,167,255,.16);
}
.case-title{font-size:16px;font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
.case-summary{font-size:13px;color:#3d3d3d;margin-bottom:10px;}
.case-row{font-size:12px;color:var(--ink-60);margin-bottom:6px;}
.case-row b{color:var(--ink);font-weight:700;}
.case-source{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:#4a72c4;text-decoration:none;font-family:inherit;
  border:0;border-bottom:1px dashed rgba(74,114,196,.5);background:none;padding:0;
  margin-top:6px;cursor:pointer;transition:color .15s;
}
.case-source:hover{color:#2d2d2d;border-bottom-style:solid;}
.source-mask{
  position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(24,30,42,.42);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.source-mask.open{display:flex;}
body.source-open{overflow:hidden;}
.source-card{
  position:relative;width:min(100%,420px);max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#fff;border-radius:20px;padding:20px;
  box-shadow:0 24px 60px rgba(20,25,40,.28);animation:source-pop .22s cubic-bezier(.2,.75,.25,1);
}
.source-card.expanded{width:min(100%,560px);}
@keyframes source-pop{from{transform:translateY(14px) scale(.97);opacity:0;}to{transform:none;opacity:1;}}
.source-card h3{font-size:15px;margin-bottom:12px;padding-right:34px;color:var(--ink);letter-spacing:.05em;}
.source-x{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
  border:0;background:rgba(45,45,45,.06);color:var(--ink-60);font-size:14px;line-height:1;
  cursor:pointer;font-family:inherit;
}
.source-card .row{font-size:13px;line-height:1.75;color:var(--ink-60);margin-bottom:6px;}
.source-card .row b{color:var(--ink);font-weight:700;}
.source-card .url{
  font-size:12px;line-height:1.6;color:#4a72c4;background:rgba(74,114,196,.08);
  padding:9px 11px;border-radius:10px;word-break:break-all;margin:4px 0 2px;
  -webkit-user-select:all;user-select:all;
}
/* —— 来源缩略图卡：手机端一次点击即可看到内容 —— */
.source-thumb{
  display:block;width:100%;border:0;padding:0;background:#fff;cursor:pointer;position:relative;
  margin:0 0 14px;border-radius:13px;overflow:hidden;text-align:left;font-family:inherit;
  box-shadow:0 6px 20px rgba(40,50,70,.11),0 0 0 1px rgba(45,45,45,.06);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.source-thumb:active{transform:scale(.986);}
.thumb-chrome{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#f2f3f7;border-bottom:1px solid rgba(45,45,45,.05);}
.thumb-chrome i{width:6px;height:6px;border-radius:50%;background:#d3d6df;display:block;flex:none;}
.thumb-chrome em{
  font-style:normal;font-size:10px;color:#8d92a0;margin-left:6px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.thumb-page{padding:12px 13px 30px;background:linear-gradient(180deg,#fff,#fdfdff);}
.thumb-brand{font-size:10px;letter-spacing:.16em;color:#6a4fc9;margin-bottom:7px;}
.thumb-title{
  font-size:13.5px;font-weight:700;color:#2d2d2d;line-height:1.45;margin-bottom:9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.thumb-lines span{display:block;height:6px;border-radius:3px;background:#edf0f5;margin-bottom:6px;}
.thumb-lines span:nth-child(2){width:92%;}
.thumb-lines span.short{width:56%;margin-bottom:0;}
.thumb-tag{
  display:inline-block;margin-top:9px;font-size:10.5px;color:#6a4fc9;
  background:rgba(201,167,255,.20);border-radius:999px;padding:2px 10px;
}
.thumb-more{
  position:absolute;right:10px;bottom:9px;font-size:10.5px;color:#4a72c4;
  background:rgba(74,114,196,.10);padding:3px 10px;border-radius:999px;letter-spacing:.02em;
}
.source-detail{display:none;}
.source-card.expanded .source-detail{display:block;animation:source-fade .2s ease;}
@keyframes source-fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.source-copy-tip{font-size:12px;color:#3f9d6b;margin-top:10px;min-height:16px;}
.source-actions{display:flex;gap:10px;margin-top:12px;}
.source-actions button{
  flex:1;min-height:44px;border-radius:12px;border:1px solid rgba(45,45,45,.14);
  background:#fff;color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer;
}
.source-actions .primary{background:#2d2d2d;color:#fff;border-color:#2d2d2d;}
.source-actions button:disabled{opacity:.45;cursor:not-allowed;}
.source-note{font-size:11.5px;color:var(--ink-35);margin-top:10px;line-height:1.6;}
@media (max-width:430px){
  .source-mask{padding:10px;}
  .source-card{padding:16px;border-radius:16px;}
  .source-card h3{font-size:14px;margin-bottom:10px;}
  .source-thumb{margin-bottom:12px;}
  .thumb-title{font-size:13px;}
  .source-card .row{font-size:12.5px;line-height:1.7;}
  .source-actions button{min-height:42px;font-size:12.5px;}
}
.empty{
  text-align:center;padding:40px;color:var(--ink-35);letter-spacing:.1em;
  background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);border-radius:20px;
}
</style>
</head>

服务不符合质量要求的，消费者可以依照国家规定、当事人约定退货，或者要求经营者履行更换、修理等义务。"}, {"name": "消费者权益保护法", "article": "第五十五条", "text": "经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍。"}, {"name": "食品安全法", "article": "第三十四条", "text": "禁止生产经营下列食品、食品添加剂、食品相关产品：……（十）标注虚假生产日期、保质期或者超过保质期的食品、食品添加剂。"}, {"name": "大气污染防治法", "article": "第八十一条", "text": "排放油烟的餐饮服务业经营者应当安装油烟净化设施并保持正常使用，或者采取其他油烟净化措施，使油烟达标排放，并防止对附近居民的正常生活环境造成污染。"}, {"name": "动物防疫法", "article": "第三十条", "text": "街道办事处、乡级人民政府应当组织协调居民委员会、村民委员会，做好本辖区流浪犬、猫的控制和处置，防止疫病传播。"}, {"name": "野生动物保护法", "article": "第十九条", "text": "有关地方人民政府应当采取措施，预防、控制野生动物可能造成的危害，保障人畜安全和农业、林业生产。"}, {"name": "产品质量法", "article": "第四十九条", "text": "生产、销售不符合保障人体健康和人身、财产安全的国家标准、行业标准的产品的，责令停止生产、销售，没收违法生产、销售的产品，并处违法生产、销售产品货值金额等值以上三倍以下的罚款。"}, {"name": "劳动合同法", "article": "第二十四条", "text": "竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。"}, {"name": "广告法", "article": "第二十八条", "text": "广告以虚假或者引人误解的内容欺骗、误导消费者的，构成虚假广告。广告有下列情形之一的，为虚假广告：（一）商品或者服务不存在的；（二）商品的性能、功能、产地、用途、质量、规格、成分、价格、生产者、有效期限、销售状况、曾获荣誉等信息，或者服务的内容、提供者、形式、质量、价格、销售状况、曾获荣誉等信息，以及与商品或者服务有关的允诺等信息与实际情况不符，对购买行为有实质性影响的；（三）使用虚构、伪造或者无法验证的科研成果、统计资料、调查结果、文摘、引用语等信息作证明材料的；（四）虚构使用商品或者接受服务的效果的；（五）以虚假或者引人误解的内容欺骗、误导消费者的其他情形。"}, {"name": "产品质量法", "article": "第十三条", "text": "可能危及人体健康和人身、财产安全的工业产品，必须符合保障人体健康和人身、财产安全的国家标准、行业标准；未制定国家标准、行业标准的，必须符合保障人体健康和人身、财产安全的合理要求。"}, {"name": "商标法", "article": "第五十七条", "text": "有下列行为之一的，均属侵犯注册商标专用权：（一）未经商标注册人的许可，在同一种商品上使用与其注册商标相同的商标的；（二）未经商标注册人的许可，在同一种商品上使用与其注册商标近似的商标，或者在类似商品上使用与其注册商标相同或者近似的商标，容易导致混淆的；（三）销售侵犯注册商标专用权的商品的；（四）伪造、擅自制造他人注册商标标识或者销售伪造、擅自制造的注册商标标识的；（五）未经商标注册人同意，更换其注册商标并将该更换商标的商品又投入市场的；（六）故意为侵犯他人注册商标专用权行为提供便利条件，帮助他人实施侵犯注册商标专用权行为的；（七）给他人的注册商标专用权造成其他损害的。"}, {"name": "刑法", "article": "第三百四十一条", "text": "非法猎捕、杀害国家重点保护的珍贵、濒危野生动物的，或者非法收购、运输、出售国家重点保护的珍贵、濒危野生动物及其制品的，处五年以下有期徒刑或者拘役，并处罚金；情节严重的，处五年以上十年以下有期徒刑，并处罚金；情节特别严重的，处十年以上有期徒刑，并处罚金或者没收财产。违反狩猎法规，在禁猎区、禁猎期或者使用禁用的工具、方法进行狩猎，破坏野生动物资源，情节严重的，处三年以下有期徒刑、拘役、管制或者罚金。"}, {"name": "食品安全法", "article": "第一百四十八条", "text": "消费者因不符合食品安全标准的食品受到损害的，可以向经营者要求赔偿损失，也可以向生产者要求赔偿损失。接到消 function useEmbedded(data){
    ALL_CASES = data.cases || [];
    document.getElementById('version').textContent = (data.version || '—') + ' · 离线';
    document.getElementById('updated').textContent = data.updated || '—';
    document.getElementById('total').textContent = data.total || ALL_CASES.length;
    renderCategories();
    const params = new URLSearchParams(location.search);
    const initCat = params.get('category');
    const initQ = params.get('q');
    if(initQ) document.getElementById('searchInput').value = initQ;
    if(params.get('mode') === 'law'){
      document.querySelector('.wrap h1').textContent = '耳辩 · 法条库';
      document.getElementById('categories').style.display = 'none';
    }
    if(initCat){
      currentCat = initCat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        if(b.dataset.cat === initCat) b.classList.add('active');
        else b.classList.remove('active');
      });
    }
    renderCases();
}

}

function renderCategories(){
  const cats = {};
  ALL_CASES.forEach(c => { cats[c.category] = (cats[c.category] || 0) + 1; });
  const box = document.getElementById('categories');
  const html = [`<button class="cat-btn active" data-cat="">全部 (${ALL_CASES.length})</button>`];
  Object.keys(cats).forEach(k => {
    html.push(`<button class="cat-btn" data-cat="${k}">${k} (${cats[k]})</button>`);
  });
  box.innerHTML = html.join('');
  box.querySelectorAll('.cat-btn').forEach(btn => {
    btn.onclick = () => {
      box.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderCases();
    };
  });
}

async function renderCases(){
  const params = new URLSearchParams(location.search);
  const isLawMode = params.get('mode') === 'law';
  const keyword = document.getElementById('searchInput').value.trim();

  // ★ 法条模式
  if(isLawMode && keyword){
    try {
      const res = await fetch(`/api/law?q=${encodeURIComponent(keyword)}`);
      const data = await res.json();
      const box = document.getElementById('caseList');
      if(!data.laws || data.laws.length === 0){
        box.innerHTML = '<div class="empty">没有找到匹配的法条</div>';
        return;
      }
      box.innerHTML = data.laws.map(l => `
        <div class="case-card">
          <span class="case-cat">法条</span>
          <div class="case-title">《${l.name}》${l.article}</div>
          <div class="case-summary" style="line-height:1.8;">${l.text}</div>
        </div>
      `).join('');
      return;
    } catch(e) {
      localLawSearch(keyword);
      return;
    }
  }

  // ★ 以下是原有的案例模式逻辑
  const kw = keyword.toLowerCase();
  let list = ALL_CASES;
  if(currentCat) list = list.filter(c => c.category === currentCat);
  if(kw){
    list = list.filter(c =>
      (c.title||'').toLowerCase().includes(kw) ||
      (c.summary||'').toLowerCase().includes(kw) ||
      (c.law||'').toLowerCase().includes(kw)
    );
  }
  const box = document.getElementById('caseList');
  if(list.length === 0){
    box.innerHTML = '<div class="empty">没有找到匹配的案例</div>';
    return;
  }
  box.innerHTML = list.map(c => {
    let srcHtml = '';
    if(c.source){
      const url = (c.source_url || '').trim();
      if(IS_MOBILE || !url){
        /* 手机端：不跳转，弹页内缩略图卡，点开即可看全部来源信息 */
        srcHtml = `<button type="button" class="case-source" data-case-id="${c.id || ''}">来源：${c.source} · 点开看 ▸</button>`;
      }else{
        /* 电脑端：新标签页直达原文，游戏本体不受影响 */
        srcHtml = `<a class="case-source" href="${url}" target="_blank" rel="noopener noreferrer">来源：${c.source} ↗</a>`;
      }
    }
    return `
    <div class="case-card">
      <span class="case-cat">${c.category || '未分类'}</span>
      <div class="case-title">${c.title || ''}</div>
      <div class="case-summary">${c.summary || ''}</div>
      ${c.law ? `<div class="case-row"><b>法条：</b>${c.law}</div>` : ''}
      ${c.penalty ? `<div class="case-row"><b>处罚：</b>${c.penalty}</div>` : ''}
      ${srcHtml}
    </div>
  `;
  }).join('');
}

function hostOf(url){
  try { return new URL(url).host.replace(/^www\./, ''); }
  catch(e){ return url ? 'source' : '—'; }
}

function openSourceCard(record){
  currentSourceUrl = (record.source_url || '').trim();

  /* 缩略图：模拟一张"原网页"的缩略预览 */
  thumbHost.textContent = currentSourceUrl ? hostOf(currentSourceUrl) : (record.source || '案例来源');
  thumbBrand.textContent = record.source || '案例来源';
  thumbTitle.textContent = record.title || '案例详情';
  thumbTag.textContent = record.law ? record.law : (record.category || '案例');

  sourceNameEl.textContent = record.source || '—';
  sourceDateEl.textContent = record.publish_date || '—';
  sourceSummaryEl.textContent = record.summary || '暂无摘要';
  sourceLawEl.textContent = record.law || '未标注';
  sourcePenaltyEl.textContent = record.penalty || '未公开';
  sourceUrlEl.textContent = currentSourceUrl || '该案例未提供原文链接';

  sourceTip.textContent = '';
  sourceCopyBtn.disabled = !currentSourceUrl;

  /* 打开即展开，一眼看到全部内容；点缩略图可收起 */
  sourceCard.classList.add('expanded');
  thumbMore.textContent = '收起 ▾';

  sourceMask.classList.add('open');
  sourceMask.setAttribute('aria-hidden', 'false');
  document.body.classList.add('source-open');
}

function toggleSourceDetail(){
  const expanded = sourceCard.classList.toggle('expanded');
  thumbMore.textContent = expanded ? '收起 ▾' : '点开查看 ▸';
  if(expanded){
    /* 展开后滚到详情顶部，手机上一眼能看到摘要 */
    setTimeout(() => {
      const detail = document.getElementById('sourceDetail');
      if(detail && sourceCard.scrollHeight > sourceCard.clientHeight){
        detail.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }
    }, 60);
  }
}

function closeSourceCard(){
  sourceMask.classList.remove('open');
  sourceMask.setAttribute('aria-hidden', 'true');
  sourceCard.classList.remove('expanded');
  document.body.classList.remove('source-open');
}

function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function copySourceUrl(){
  if(!currentSourceUrl) return;
  const done = (ok) => {
    sourceTip.style.color = ok ? '#3f9d6b' : '#c96b5a';
    sourceTip.textContent = ok
      ? '已复制，粘贴到浏览器即可查看原文'
      : '复制失败，长按上方链接手动复制';
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(currentSourceUrl).then(() => done(true)).catch(() => done(fallbackCopy(currentSourceUrl)));
    return;
  }
  done(fallbackCopy(currentSourceUrl));
}

document.getElementById('caseList').addEventListener('click', (event) => {
  const trigger = event.target.closest('.case-source');
  if(!trigger) return;
  /* 电脑端是 <a target="_blank">，让它自己跳转 */
  if(trigger.tagName === 'A') return;
  event.preventDefault();
  event.stopPropagation();
  const record = ALL_CASES.find((item) => item.id === trigger.dataset.caseId);
  if(record) openSourceCard(record);
});
sourceThumb.addEventListener('click', (event) => {
  event.preventDefault();
  event.stopPropagation();
  toggleSourceDetail();
});
sourceThumb.addEventListener('keydown', (event) => {
  if(event.key === 'Enter' || event.key === ' '){
    event.preventDefault();
    toggleSourceDetail();
  }
});
sourceCopyBtn.addEventListener('click', copySourceUrl);
document.getElementById('sourceClose').addEventListener('click', closeSourceCard);
document.getElementById('sourceCloseX').addEventListener('click', closeSourceCard);
sourceMask.addEventListener('click', (event) => { if(event.target === sourceMask) closeSourceCard(); });
document.addEventListener('keydown', (event) => {
  if(event.key !== 'Escape') return;
  if(sourceMask.classList.contains('open')){ closeSourceCard(); }
});
</script>
</body>
