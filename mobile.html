<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9ccd0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="耳辩">
<link rel="apple-touch-icon" href="assets/icon/icon-192.png">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  window.location.replace("./index.html");
</script>
<title>耳辩 · 与尔同辩（手机版）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Noto+Sans+SC:wght@200;300;400;500;700&family=Zhi+Mang+Xing&display=swap');
:root{
  --ink:#2d2d2d;
  --ink-60:rgba(45,45,45,.6);
  --ink-35:rgba(45,45,45,.35);
  --ink-12:rgba(45,45,45,.12);
  --blue:#5b8def; --pink:#e07ab8;
  --iri:linear-gradient(100deg,#7ac8ff,#c9a7ff,#ff9ed2,#ffd9a0,#8ef0d2);
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Space Grotesk','Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#d8dbdf 0%,#c4c7cb 55%,#cfd3d8 100%);
  color:var(--ink);overflow-x:hidden;min-height:100vh;
}

/* ===== 背景：极光斑 + 几何线圆 ===== */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;}
.a1{width:56vmax;height:56vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle at 40% 40%,#9fd0ff,transparent 65%);animation:drift1 26s ease-in-out infinite alternate;}
.a2{width:48vmax;height:48vmax;right:-16vmax;top:20vh;background:radial-gradient(circle at 55% 45%,#ffc4e6,transparent 65%);animation:drift2 32s ease-in-out infinite alternate;}
.a3{width:44vmax;height:44vmax;left:20vw;bottom:-22vmax;background:radial-gradient(circle at 50% 50%,#ffe9bf,transparent 62%);animation:drift3 38s ease-in-out infinite alternate;}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12);}}
@keyframes drift2{to{transform:translate(-8vmax,6vmax) scale(.92);}}
@keyframes drift3{to{transform:translate(6vmax,-7vmax) scale(1.08);}}
.bg-fx svg.geo{position:absolute;inset:0;width:100%;height:100%;}

/* ===== 开屏 ===== */
.splash{
  position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.splash.done{opacity:0;pointer-events:none;transform:scale(1.04);}
.splash-pieces{display:flex;align-items:flex-end;gap:38px;margin-bottom:36px;}
.sp-piece{width:100px;filter:drop-shadow(0 18px 22px rgba(60,80,120,.28));}
.sp-piece svg{width:100%;height:auto;display:block;}
.sp-piece.p1{animation:floatA 4.6s ease-in-out infinite;}
.sp-piece.p2{animation:floatB 4.6s ease-in-out 1s infinite;}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-2.5deg);}50%{transform:translateY(-14px) rotate(1.5deg);}}
@keyframes floatB{0%,100%{transform:translateY(-6px) rotate(2deg);}50%{transform:translateY(8px) rotate(-1.5deg);}}
.splash-title{font-size:clamp(52px,11vw,92px);font-weight:200;letter-spacing:.42em;text-indent:.42em;color:var(--ink);}
.splash-line{width:130px;height:2px;margin:24px 0 18px;background:var(--iri);border-radius:2px;}
.splash-sub{font-size:13px;letter-spacing:.55em;text-indent:.55em;color:var(--ink-60);font-weight:300;margin-bottom:46px;}
.splash-btn{
  font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.35em;text-indent:.35em;
  padding:16px 54px;background:#2d2d2d;color:#f2f3f5;border:none;border-radius:999px;cursor:pointer;
  box-shadow:0 14px 34px rgba(45,45,45,.28);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
}
.splash-btn:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(45,45,45,.34);}
.splash-btn:active{transform:translateY(1px) scale(.98);}

/* ===== 游戏区 ===== */
.app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto;padding:14px 14px 110px;}

/* 顶部 HUD */
.topbar{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  background:rgba(255,255,255,.35);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:8px 12px;
  box-shadow:0 12px 32px rgba(60,70,90,.12);
}
.hud{display:flex;gap:10px;flex:1;min-width:0;flex-wrap:wrap;}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;border:1px solid rgba(255,255,255,.6);border-radius:12px;
  background:rgba(255,255,255,.4);font-size:15px;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;font-family:inherit;
  transition:background .167s var(--ease),transform .167s var(--ease);
}
.icon-btn:hover{background:rgba(255,255,255,.75);}
.icon-btn:active{transform:scale(.92);}
#fragBtn .frag-badge{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 5px;
  background:var(--iri);color:#2d2d2d;font-size:10px;font-weight:700;
  border-radius:9px;border:1.5px solid #fff;
  display:flex;align-items:center;justify-content:center;
}
.player-chip{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);
  border-radius:16px;padding:5px 12px 5px 6px;
  transition:all .25s var(--ease);flex:1;min-width:0;max-width:180px;
}
.player-chip.active{
  background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) padding-box,var(--iri) border-box;
  border:1.5px solid transparent;
  box-shadow:0 8px 24px rgba(120,140,200,.28);
}
.chip-avatar{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.75);overflow:hidden;background:rgba(255,255,255,.5);flex-shrink:0;}
.chip-avatar svg{width:100%;height:100%;display:block;}
.chip-info{flex:1;min-width:0;}
.chip-name{font-size:11px;font-weight:500;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-60);}
.chip-score{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink);}
.chip-score small{font-size:10px;font-weight:400;color:var(--ink-35);margin-left:2px;}

/* ===== 棋盘 ===== */
.scene{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0;}
.board-wrap{position:relative;width:100%;max-width:680px;}
.board{
  position:relative;width:100%;aspect-ratio:680/560;
  background:rgba(255,255,255,.2);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid rgba(255,255,255,.5);border-radius:28px;padding:20px;
  box-shadow:0 24px 60px rgba(60,70,95,.14);
}
.board svg.path-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

#tileLayer{position:relative;width:100%;height:100%;z-index:2;}
.twrap{position:absolute;z-index:2;transform-origin:center;transition:transform .2s;}
.tile{
  position:relative;width:100%;height:100%;
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);border-radius:16px;
  box-shadow:0 6px 18px rgba(70,85,110,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.tile::before{
  content:attr(data-num);position:absolute;top:5px;left:8px;
  font-size:10px;font-weight:500;color:var(--ink-35);
}
.t-key{font-size:16px;font-weight:700;letter-spacing:.5px;line-height:1;color:var(--ink);}
.t-icon{font-size:13px;line-height:1;margin-bottom:3px;color:var(--ink-60);}
.t-place{font-size:9px;font-weight:400;letter-spacing:.08em;color:var(--ink-35);margin-top:2px;}

.tile.start{background:rgba(255,255,255,.62);}
.tile.finish{background:linear-gradient(135deg,rgba(255,233,180,.55),rgba(255,255,255,.45));}
.tile.debate{background:linear-gradient(135deg,rgba(255,158,180,.22),rgba(255,255,255,.4));}
.tile.knowledge{background:linear-gradient(135deg,rgba(142,240,210,.26),rgba(255,255,255,.4));}
.tile.trap{background:linear-gradient(135deg,rgba(224,73,122,.16),rgba(255,255,255,.4));}
.tile.item{background:linear-gradient(135deg,rgba(201,167,255,.26),rgba(255,255,255,.4));}
.tile.mystery{background:linear-gradient(135deg,rgba(122,200,255,.26),rgba(255,255,255,.4));}

.tile.spring{animation:tileSpring .5s cubic-bezier(.34,1.56,.64,1);z-index:10;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 12px 32px rgba(120,140,200,.35);}
@keyframes tileSpring{
  0%{transform:translateY(0) scale(1);}
  40%{transform:translateY(10px) scale(.95);}
  70%{transform:translateY(-14px) scale(1.06);}
  100%{transform:translateY(0) scale(1);}
}

/* 玻璃棋子 */
.piece{
  position:absolute;z-index:15;width:48px;height:68px;
  transition:top .28s linear,left .28s linear;
  pointer-events:none;
  filter:drop-shadow(0 10px 12px rgba(60,80,120,.3));
}
.piece svg{width:100%;height:100%;display:block;}

/* ===== 骰子 ===== */
.dice-wrap{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.dice-btn{
  position:relative;width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:26px;font-weight:700;color:var(--ink);
  transition:transform .2s var(--ease);
}
.dice-btn::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg,#7ac8ff,#c9a7ff,#ff9ed2,#ffd9a0,#8ef0d2,#7ac8ff);
  filter:blur(7px);opacity:.75;animation:spinRing 7s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg);}}
.dice-btn:hover{transform:translateY(-2px);}
.dice-btn:active{transform:scale(.94);}
.dice-btn:disabled{opacity:.55;cursor:not-allowed;}
.dice-btn.shake{animation:diceShake .4s ease-in-out;}
@keyframes diceShake{
  0%,100%{transform:rotate(0deg);}
  20%{transform:rotate(-15deg);}
  40%{transform:rotate(15deg);}
  60%{transform:rotate(-10deg);}
  80%{transform:rotate(10deg);}
}
.dice-label{font-size:11px;font-weight:500;letter-spacing:.4em;text-indent:.4em;color:var(--ink-60);}

/* ===== 弹窗 ===== */
.overlay{
  position:fixed;inset:0;background:rgba(190,196,202,.45);
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.overlay.open{opacity:1;pointer-events:auto;}
.modal{
  background:rgba(250,251,253,.68);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);
  border:1px solid rgba(255,255,255,.85);border-radius:26px;width:100%;max-width:500px;
  max-height:88vh;overflow-y:auto;position:relative;
  transform:translateY(28px) scale(.96);transition:transform .45s var(--ease);
  box-shadow:0 30px 80px rgba(55,65,90,.28);
}
.overlay.open .modal{transform:translateY(0) scale(1);}

/* 知识卡片 */
.kcard{padding:30px 26px;text-align:center;}
.kcard-tag{
  display:inline-block;font-size:11px;font-weight:500;letter-spacing:.35em;text-indent:.35em;
  padding:6px 18px;border-radius:999px;margin-bottom:16px;border:1px solid;
}
.kcard-tag.know{color:#0b8a63;border-color:rgba(14,168,119,.45);background:rgba(142,240,210,.18);}
.kcard-tag.trap{color:#c23367;border-color:rgba(224,73,122,.4);background:rgba(255,158,194,.15);}
.kcard-tag.item{color:#6a4fc9;border-color:rgba(150,120,230,.45);background:rgba(201,167,255,.18);}
.kcard-title{font-size:20px;font-weight:700;letter-spacing:.06em;margin-bottom:16px;color:var(--ink);}
.kcard-body{
  font-size:14px;font-weight:400;line-height:2;color:#3d3d3d;
  margin-bottom:22px;text-align:left;
  background:rgba(255,255,255,.5);border-radius:18px;padding:18px;
  border:1px solid rgba(255,255,255,.8);
}
.kcard-body b{color:var(--ink);font-weight:700;}
.kcard-body .highlight{background:linear-gradient(transparent 55%,rgba(255,217,160,.85) 55%);padding:0 3px;font-weight:700;color:#8a6a1f;}
.kcard-btn{
  font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.3em;text-indent:.3em;
  padding:14px 44px;background:#2d2d2d;color:#f2f3f5;border:none;border-radius:999px;cursor:pointer;
  box-shadow:0 10px 26px rgba(45,45,45,.25);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.kcard-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(45,45,45,.3);}
.kcard-btn:active{transform:translateY(1px) scale(.98);}
.kcard-btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid rgba(255,255,255,.9);box-shadow:none;}

/* 辩论弹窗 */
.debate-modal{
  background:rgba(250,251,253,.68);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);
  border:1px solid rgba(255,255,255,.85);border-radius:26px;width:100%;max-width:520px;
  position:relative;overflow:hidden;
  box-shadow:0 30px 80px rgba(55,65,90,.28);
}
.debate-bg{position:absolute;inset:0;z-index:0;opacity:.09;pointer-events:none;}
.debate-bg svg{width:100%;height:100%;}
.debate-content{position:relative;z-index:1;padding:26px 22px;}
.debate-header{text-align:center;margin-bottom:16px;padding-bottom:14px;position:relative;}
.debate-header::after{
  content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:72px;height:2px;background:var(--iri);border-radius:2px;
}
.debate-header h3{font-size:15px;font-weight:700;letter-spacing:.15em;color:var(--ink);margin-bottom:5px;}
.debate-header p{font-size:11px;color:var(--ink-60);letter-spacing:.3em;text-indent:.3em;font-weight:400;}
.debate-q{font-size:17px;font-weight:700;line-height:1.75;margin:6px 0 14px;text-align:center;padding:0 6px;color:var(--ink);}
/* 正反方立场卡片 */
.debate-sides{display:flex;gap:10px;margin-bottom:12px;}
.side-pro,.side-con{
  flex:1;padding:11px 13px;border-radius:14px;border:1px solid;
  font-size:12px;line-height:1.65;background:rgba(255,255,255,.4);
}
.side-pro{border-color:rgba(91,141,239,.5);}
.side-pro .side-label{color:var(--blue);}
.side-con{border-color:rgba(224,122,184,.5);}
.side-con .side-label{color:var(--pink);}
.side-label{font-weight:700;font-size:10px;letter-spacing:.35em;margin-bottom:4px;}
.side-text{font-weight:400;color:#3d3d3d;}

/* 角色彩蛋 */
.debate-egg{
  font-size:12px;color:var(--ink-60);
  padding:8px 12px;border-left:2px solid var(--ink-12);
  margin-bottom:12px;line-height:1.7;
  background:rgba(255,255,255,.3);border-radius:0 10px 10px 0;
}

.debate-story{
  font-size:12.5px;color:var(--ink-60);line-height:1.75;
  text-align:left;padding:11px 14px;margin-bottom:14px;
  background:rgba(255,255,255,.4);border-radius:14px;border-left:2px solid var(--ink-12);
}
.debate-input{
  width:100%;min-height:84px;padding:13px 15px;font-family:inherit;
  font-size:14px;line-height:1.7;
  border:1px solid rgba(255,255,255,.9);border-radius:14px;resize:vertical;outline:none;
  background:rgba(255,255,255,.55);color:var(--ink);
  transition:border-color .2s,box-shadow .2s;
}
.debate-input:focus{border-color:rgba(91,141,239,.6);box-shadow:0 0 0 3px rgba(91,141,239,.15);}
.debate-input::placeholder{color:var(--ink-35);}
.debate-actions{display:flex;gap:10px;margin-top:12px;}
.debate-actions button{
  flex:1;font-family:inherit;font-size:13px;font-weight:500;letter-spacing:.25em;text-indent:.25em;
  padding:13px;border:none;border-radius:999px;cursor:pointer;transition:all .18s var(--ease);
}
.debate-actions #submitBtn{background:#2d2d2d;color:#f2f3f5;flex:1.6;box-shadow:0 8px 22px rgba(45,45,45,.25);}
.debate-actions #submitBtn:hover:not(:disabled){transform:translateY(-1px);}
.debate-actions #submitBtn:disabled{opacity:.55;cursor:wait;}
.debate-actions #passBtn{background:rgba(255,255,255,.55);color:var(--ink-60);border:1px solid rgba(255,255,255,.9);}
.debate-result{
  font-size:13.5px;font-weight:500;text-align:center;padding:14px;border-radius:16px;
  margin-top:14px;display:none;line-height:1.7;border:1px solid;
}
.debate-result.show{display:block;}
.debate-result.ok{background:rgba(142,240,210,.2);color:#0b8a63;border-color:rgba(14,168,119,.4);}
.debate-result.ng{background:rgba(255,158,194,.16);color:#c23367;border-color:rgba(224,73,122,.4);}

/* 碎片提示 */
.frag-toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-70px);
  background:rgba(30,30,35,.78);backdrop-filter:blur(14px);
  color:#f2f3f5;padding:12px 26px;border-radius:999px;
  font-size:13px;font-weight:500;letter-spacing:.1em;z-index:200;
  transition:transform .5s var(--ease);
  pointer-events:none;border:1px solid rgba(255,255,255,.22);
}
.frag-toast.show{transform:translateX(-50%) translateY(0);}
.frag-toast .frag-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--iri);margin-right:9px;vertical-align:middle;}

/* AI 对手发言条（移动端） */
.ai-say{
  position:fixed;top:62px;left:50%;width:min(94vw,520px);
  transform:translateX(-50%) translateY(-130%);
  background:rgba(28,30,34,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.2);border-radius:18px;
  padding:12px 16px;z-index:210;color:#f2f3f5;
  box-shadow:0 16px 40px rgba(20,30,50,.26);
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .42s ease;
  opacity:0;pointer-events:none;
}
.ai-say.show{transform:translateX(-50%) translateY(0);opacity:1;}
.ai-say-name{font-size:10px;font-weight:700;letter-spacing:.2em;color:#8ef0d2;margin-bottom:6px;}
.ai-say-text{font-size:13px;line-height:1.68;letter-spacing:.01em;}
.ai-say-verdict{font-size:11px;line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.66);}
.ai-say-verdict b{color:#ffd9a0;font-weight:700;}

/* 手记 */
.frag-modal{padding:28px 22px;}
.frag-title{font-size:20px;font-weight:700;letter-spacing:.3em;text-indent:.3em;text-align:center;margin-bottom:6px;color:var(--ink);}
.frag-sub{font-size:12px;color:var(--ink-60);letter-spacing:.15em;text-align:center;margin-bottom:20px;}
.frag-progress{display:flex;justify-content:center;gap:7px;margin-bottom:20px;}
.frag-progress .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(45,45,45,.2);}
.frag-progress .dot.on{background:var(--iri);border-color:transparent;}
.frag-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.frag-item{
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);
  border-radius:16px;padding:14px 16px;transition:all .2s var(--ease);
}
.frag-item.locked{opacity:.45;}
.frag-item .frag-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:.05em;}
.frag-item .frag-body{font-size:12.5px;color:#3d3d3d;line-height:1.75;}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
let soundOn=true;
function tone(type){
  if(!soundOn)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  const n=audioCtx.currentTime;
  if(type==="pop"){o.type="sine";o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(1000,n+.1);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);}
  else if(type==="ding"){o.type="sine";o.frequency.setValueAtTime(700,n);o.frequency.exponentialRampToValueAtTime(1400,n+.15);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.start(n);o.stop(n+.25);}
  else if(type==="tick"){o.type="triangle";o.frequency.setValueAtTime(400,n);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);o.start(n);o.stop(n+.06);}
  else if(type==="win"){[523,659,784,1047].forEach((f,i)=>{const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.type="sine";o2.frequency.value=f;g2.gain.setValueAtTime(.1,n+i*.1);g2.gain.exponentialRampToValueAtTime(.001,n+i*.1+.2);o2.start(n+i*.1);o2.stop(n+i*.1+.2);});}
}

  let pool=DEBATES.filter(x=>!usedDebates.has(x.q));
  if(pool.length===0){usedDebates.clear();pool=DEBATES;}
  const d=pool[Math.floor(Math.random()*pool.length)];
  usedDebates.add(d.q);
  return d;
}

function jit(i){
  const jx=((i*53)%19)-9, jy=((i*97)%17)-8;
  const rot=(((i*137)%11)-5)*1.2;
  let sc=0.92+((i*71)%16)/100;
  if(i===0||i===TILES.length-1) sc=1.22;
  return {jx,jy,rot,sc};
}

function computeLayout(){
  const W=680,H=560,cols=4,rows=5;
  const padX=60,padY=45;
  const availW=W-padX*2,availH=H-padY*2;
  const stepX=availW/(cols-1),stepY=availH/(rows-1);
  const layouts=[];
  for(let i=0;i<TILES.length;i++){
    const row=Math.floor(i/cols),col=i%cols;
    const actualCol=row%2===0?col:(cols-1-col);
    const x=padX+actualCol*stepX;
    const y=padY+row*stepY;
    const scale=0.8+row*0.085;
    layouts.push({x,y,scale});
  }
  return layouts;
}
const LAYOUT=computeLayout();

function drawPath(){
  const svg=$("#pathSvg");
  svg.innerHTML="";
  let d="M";
  for(let i=0;i<TILES.length;i++){
    const lo=LAYOUT[i],j=jit(i);
    d+=(i===0?"":"L")+(lo.x+j.jx)+","+(lo.y+j.jy);
  }
  const pathEl=document.createElementNS("http://www.w3.org/2000/svg","path");
  pathEl.setAttribute("d",d);
  pathEl.setAttribute("fill","none");
  pathEl.setAttribute("stroke","#2d2d2d");
  pathEl.setAttribute("stroke-width","1.5");
  pathEl.setAttribute("stroke-dasharray","2,7");
  pathEl.setAttribute("stroke-linecap","round");
  pathEl.setAttribute("stroke-opacity",".5");
  svg.appendChild(pathEl);
  for(let i=0;i<TILES.length-1;i++){
    const a=LAYOUT[i],b=LAYOUT[i+1],ja=jit(i),jb=jit(i+1);
    const mx=(a.x+ja.jx+b.x+jb.jx)/2,my=(a.y+ja.jy+b.y+jb.jy)/2;
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const arrow=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    const s=5;
    arrow.setAttribute("points",`${mx},${my-s} ${mx+s*1.3},${my+s} ${mx-s*1.3},${my+s}`);
    arrow.setAttribute("fill","#2d2d2d");
    arrow.setAttribute("transform",`rotate(${ang*180/Math.PI+90},${mx},${my})`);
    arrow.setAttribute("opacity",".7");
    svg.appendChild(arrow);
  }
  const start=LAYOUT[0];
  const startCircle=document.createElementNS("http://www.w3.org/2000/svg","circle");
  startCircle.setAttribute("cx",start.x);startCircle.setAttribute("cy",start.y);
  startCircle.setAttribute("r","22");startCircle.setAttribute("fill","none");
  startCircle.setAttribute("stroke","#2d2d2d");startCircle.setAttribute("stroke-width","3");
  startCircle.setAttribute("stroke-dasharray","4,4");
  startCircle.setAttribute("opacity",".6");
  svg.appendChild(startCircle);
}

/* ============================================================
   离线裁判：服务器不可用时本地规则判定
   ============================================================ */
let offlineMode = false;
function localJudge(text, d){
  const t = text.replace(/\s/g,'');
  const hasLogic = /因为|所以|因此|但是|然而|由于|根据|如果|首先|其次|可见|说明|应当|应该/.test(t);
  const hasLaw = /《[^》]+》|第.{1,6}条/.test(t);
  const hasFact = /\d|案例|事实|证据|记录|规定|责任|义务|权利/.test(t);
  const emotional = /^(就是|对对对|太蠢|随便|无语|哈哈)/.test(t) || t.length < 6;
  if(emotional){
    return {valid:false, reason:"发言缺少实质内容，试着说出你的依据。"};
  }
  if(!hasLogic && !hasLaw && t.length < 15){
    return {valid:false, reason:"论证太简单了。用上「因为……所以……」，或者引用相关法条。"};
  }
  let damage = 6;
  let tags = [];
  if(hasLogic){ damage += 3; tags.push("逻辑论证"); }
  if(hasLaw){ damage += 4; tags.push("法条引用"); }
  if(hasFact){ damage += 2; tags.push("事实依据"); }
  if(t.length > 40){ damage += 1; }
  damage = Math.min(damage, 15);
  return {valid:true, type: tags.length ? tags.join(" + ") : "观点陈述", damage:damage,
          reason:"离线裁判：论证成立" + (tags.length ? "（" + tags.join("、") + "）" : "。")};
}

    setTimeout(()=>input.focus(),350);
  });
}
/* ============================================================
   碎片
   ============================================================ */
function checkFragment(boost){
  FRAGMENTS.forEach(f=>{
    if(collectedFrags.has(f.id))return;
    const c=boost?f.chance*1.5:f.chance;
    if(Math.random()<c){
      collectedFrags.add(f.id);
      const toast=$("#fragToast");$("#fragText").textContent=`获得手记：${f.title}`;
      toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2800);
      const ff=$("#fragFabBtn");if(ff){ff.classList.remove("pulse");void ff.offsetWidth;ff.classList.add("pulse");}
      updateFragBadge();
    }
  });
}

function updateFragBadge(){
  const btn=$("#fragFabBtn");
  if(!btn)return;
  let badge=btn.querySelector(".frag-badge");
  const n=collectedFrags.size;
  if(n<=0){if(badge)badge.remove();return;}
  if(!badge){
    badge=document.createElement("span");
    badge.className="frag-badge";
    btn.appendChild(badge);
  }
  badge.textContent=n;
}

function showFragments(){
  const collected=[...collectedFrags];
  const total=FRAGMENTS.length;
  const isComplete=collected.length>=total;

  const dots=FRAGMENTS.map(f=>`<div class="dot ${collectedFrags.has(f.id)?"on":""}"></div>`).join("");

  const items=FRAGMENTS.map(f=>{
    const has=collectedFrags.has(f.id);
    return `<div class="frag-item ${has?"":"locked"}">
      <div class="frag-head">${has?"◈":"·"} ${has?f.title:"？？？"}</div>
      <div class="frag-body">${has?f.text:"还没找到这一页。继续走，继续问。"}</div>
    </div>`;
  }).join("");

  const note=isComplete
    ? `<div style="text-align:center;font-size:14px;font-weight:900;color:#6a4fc9;margin-bottom:16px;line-height:1.7;">六页手记，拼出了五年前的真相。<br><span style="font-size:12px;font-weight:600;color:#888;">涂改生产日期的是厂家，压货的是批发商，阿婆只是最后一环。<br>父亲没发出去的稿子、母亲没递出的证词，如今由你们写完了。</span></div>`
    : "";

  openModal(`
    <div class="frag-modal">
      <div class="frag-title">手 记</div>
      <div class="frag-sub">渡口旧事 · ${collected.length} / ${total} 页</div>

   骰子与移动
   ============================================================ */
async function rollDice(){
  if(gameOver)return;
  if(mode==="solo"&&players[cur]&&players[cur].ai&&!autoTurn)return;
  autoTurn=false;
  const btn=$("#diceBtn");btn.disabled=true;
  btn.classList.add("shake");tone("ding");
  await new Promise(r=>setTimeout(r,400));
  btn.classList.remove("shake");
  const steps=Math.floor(Math.random()*6)+1;
  btn.textContent=steps;
  await hop(cur,steps);
  btn.textContent="⚄";btn.disabled=false;
}

async function hop(pIdx,steps){
  for(let i=0;i<steps;i++){
    if(pos[pIdx]<TILES.length-1){
      pos[pIdx]++;
      setPiecePos(pIdx,pos[pIdx]);
      tone("tick");
      await new Promise(r=>setTimeout(r,280));
    }
  }
  await onLandTile(pIdx);
}

async function onLandTile(pIdx){
  const t=TILES[pos[pIdx]];
  const tileEl=$("#tileLayer").children[pos[pIdx]].querySelector(".tile");
  tileEl.classList.add("spring");setTimeout(()=>tileEl.classList.remove("spring"),900);
  const pcEl=$("#piece-"+pIdx);if(pcEl){pcEl.classList.add("landed");setTimeout(()=>pcEl.classList.remove("landed"),900);}
  tone("pop");
  checkFragment(false);

  if(players[pIdx].ai){
    await aiTile(pIdx,t);
    if(!gameOver){cur=(cur+1)%players.length;renderHUD();}
    return;
  }

  if(t.type==="knowledge"){
    const k=KNOWLEDGE[Math.floor(Math.random()*KNOWLEDGE.length)];
    await showKCard(k.title,k.body,"知识卡片","know");
    scores[pIdx]+=2;renderHUD();
    journal.push({type:"knowledge",category:"知识",title:k.title});
  } else if(t.type==="debate"){
    const d=pickDebate();
    await showAIDebate(pIdx,d);
  } else if(t.type==="trap"){
    const tr=TRAPS[Math.floor(Math.random()*TRAPS.length)];
    await showKCard(tr.title,tr.body+"<br><br><b>效果：</b>"+tr.effect,"事件","trap","倒霉");
    journal.push({type:"trap",category:"事件",title:tr.title});
  } else if(t.type==="item"){
    const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];
    await showKCard(it.title,it.body+"<br><br><b>效果：</b>"+it.effect,"获得道具","item","收下");
    journal.push({type:"item",category:"道具",title:it.title});
  } else if(t.type==="finish"){
    return showArrival();
  }
  cur=(cur+1)%players.length;
  renderHUD();
  maybeAutoTurn();
}

/* 网络/接口失败时的本地降级发言，保证能过 localJudge */
function fallbackOpponentLine(d,stance){
  const st=(stance==="反方"?(d.con||d.pro):(d.pro||d.con))||"这一方的主张值得重新审视";
  return "根据"+(d.law||"相关法律规定")+"，"+st+"，所以这一立场在法理上是站得住的。";
}
async function aiTile(pIdx,t){
  const name=players[pIdx].name;
  if(t.type==="knowledge"){
    scores[pIdx]+=2;renderHUD();aiToast(name+" 读到一张知识卡片 · +2 分");await new Promise(r=>setTimeout(r,1300));
  }else if(t.type==="debate"){
    const d=pickDebate();
    await new Promise(r=>setTimeout(r,600));
    const stance=Math.random()<.5?"正方":"反方";
    const reference=(stance==="反方"?(d.con||d.pro):(d.pro||d.con))||"";
    let line="",ok=false,gained=0,reason="",judgeType="无效";
    try{
      const res=await fetch('/api/solo-turn',{signal:AbortSignal.timeout(25000),
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:d.q,law:d.law,category:d.category,stance:stance,reference:reference})
      });
      if(!res.ok)throw new Error("HTTP "+res.status);
      const data=await res.json();
      if(!data||typeof data.line!=="string"||!data.line.trim())throw new Error("empty line");
      line=data.line.trim();ok=!!data.valid;reason=data.reason||"";judgeType=data.type||"无效";
      gained=ok?Math.max(2,Math.round((data.damage||10)/3)):0;
    }catch(err){
      /* 接口不可用时降级：本地生成发言 + 本地裁判，保证游戏不卡住 */
      line=fallbackOpponentLine(d,stance);
      const lj=localJudge(line,d);
      ok=!!lj.valid;reason=lj.reason||"";judgeType=lj.type||"无效";
      gained=ok?Math.max(2,Math.round((lj.damage||10)/3)):0;
      const ft=$("#fragToast");
      if(ft){$("#fragText").textContent="AI 裁判暂不可用 · 已切换为本地裁判";ft.classList.add("show");setTimeout(()=>ft.classList.remove("show"),2600);}
    }
    if(ok){scores[pIdx]+=gained;renderHUD();}
    aiSay(name+" · "+stance+" · "+d.category,
      line,
      ok?("判定有效 · "+judgeType+" · <b>+"+gained+" 分</b>"+(reason?"<br>"+reason:""))
        :("判定无效 · <b>+0 分</b>"+(reason?"<br>"+reason:"")),
      ok);
    tone(ok?"ding":"pop");
    checkFragment(ok);
    journal.push({type:"debate",category:d.category,title:d.q,choice:name+"（AI 辩手·"+stance+"）",input:line,result:{valid:ok,type:judgeType,damage:ok?gained:0,reason:reason}});
    await new Promise(r=>setTimeout(r,2800));
  }else if(t.type==="trap"){
    const tr=TRAPS[Math.floor(Math.random()*TRAPS.length)];
    aiToast(name+" 遇到「"+tr.title+"」");await new Promise(r=>setTimeout(r,1300));
  }else if(t.type==="item"){
    const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];
    aiToast(name+" 获得「"+it.title+"」");await new Promise(r=>setTimeout(r,1300));
  }else if(t.type==="finish"){
    return endGame();
  }
}

function openDrawer(opts) {
  opts = opts || {};
  const params = new URLSearchParams();
  if (opts.category) params.set('category', opts.category);
  if (opts.q) params.set('q', opts.q);
  const base = '/knowledge-base';
  const url = base + (params.toString() ? '?' + params.toString() : '');
  document.getElementById('drawerIframe').src = url;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
  setTimeout(() => {
    document.getElementById('drawerIframe').src = 'about:blank';
  }, 400);
}
(function(){
  var st=document.getElementById('introStage');
  if(!st)return;
  var finished=false;
  var fadeOut=function(){
    if(finished)return;
    finished=true;
    st.classList.add('done');
    setTimeout(function(){st.remove();},750);
  };
  var startGame=function(){
    if(finished)return;
    fadeOut();
    if(audioCtx.state==="suspended")audioCtx.resume();
    openModeSelect();
  };
  var timer=setTimeout(fadeOut,2000);
  st.addEventListener('click',function(){
    clearTimeout(timer);
    startGame();
  });
  st.addEventListener('keydown',function(event){
    if(event.key==='Enter'||event.key===' '){
      event.preventDefault();
      clearTimeout(timer);
      startGame();
    }
  });
})();
$("#homeKbBtn").onclick=function(){openDrawer();};
</script>

<!-- 侧边抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">全 知 笔 记</div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <iframe id="drawerIframe" src="about:blank"></iframe>
  </div>
</div>
</body>
</html>
